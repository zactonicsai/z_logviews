apiVersion: 1

datasources:
  - name: TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: metrics
    user: nimbus
    secureJsonData:
      password: nimbus
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    isDefault: true
    editable: true

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: np-events
    jsonData:
      esVersion: "8.15.3"
      timeField: time
      logMessageField: message
      logLevelField: severity
    editable: true

  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    url: http://clickhouse:8123
    jsonData:
      defaultDatabase: nimbuspulse
      port: 8123
      protocol: http
      server: clickhouse
      username: nimbus
      tlsSkipVerify: true
    secureJsonData:
      password: nimbus
    editable: true
