server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # Serve the ETL form on /etl/
    location /etl/ {
        alias /usr/share/nginx/html/etl/;
        try_files $uri $uri/ /etl/index.html;
        add_header Cache-Control "no-store";
    }
}
