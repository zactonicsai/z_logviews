server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # CORS not strictly needed since the dashboard hits services directly
    # via fetch() on the same hostname, different ports.
}
